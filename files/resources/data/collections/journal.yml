# Column types for journal.json — the source of truth the builder
# reads: richtext columns open in the rich editor (Content drawer
# and any section repeater listing this collection).
fields:
    slug: { type: text }
    title: { type: text }
    description: { type: textarea }
    category: { type: text }
    date: { type: text }
    readTime: { type: text }
    author: { type: text }
    authorRole: { type: text }
    authorImage: { type: image }
    image: { type: image }
    imageAlt: { type: text }
    link: { type: url }
    content: { type: richtext }
