# The visual editor's contract for sections/hero.blade.php: each field maps
# to a prop in the component's props. Defaults fill any attribute the page
# doesn't pass. Field names are camelCase, matching the props they fill.
title: Hero
description: The opening statement — a huge headline with a pink sticker phrase, subcopy, buttons, and the framed portrait
fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "Hi — I'm Marlo Vane"
    headingStart:
        type: text
        label: Heading (before the pill)
        default: "I make brands"
    headingPill:
        type: text
        label: Heading pill phrase
        description: The phrase set on the pink sticker.
        default: "too bold"
    headingEnd:
        type: text
        label: Heading (after the pill)
        default: "to scroll past."
    body:
        type: textarea
        label: Supporting copy
        default: "Chronicle is my one-person design & code studio. Strategy, identity, and websites for people with something to say — built loud, shipped fast, and maintained like I mean it."
    primaryText:
        type: text
        label: Primary button text
        default: "View the work"
    primaryLink:
        type: url
        label: Primary button link
        default: "/work"
    secondaryText:
        type: text
        label: Secondary button text
        default: "More about me"
    secondaryLink:
        type: url
        label: Secondary button link
        default: "/about"
    image:
        type: image
        label: Portrait
        default: "/assets/images/hero-portrait.jpg"
    imageAlt:
        type: text
        label: Portrait alt text
        default: "Torn-paper collage portrait of Marlo Vane"
    caption:
        type: text
        label: Frame caption
        default: "Fig. 01 — The human"
    showStickers:
        type: toggle
        label: Show sticker chips
        default: "1"
    stickerOne:
        type: text
        label: First sticker
        default: "Pixel perfectish"
    stickerTwo:
        type: text
        label: Second sticker
        default: "Less, but louder"
