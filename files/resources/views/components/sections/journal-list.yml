title: Journal list
description: Ledger rows of posts from the journal collection — date, title, category, arrow
fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "Journal"
    heading:
        type: text
        label: Heading
        default: "Notes from the desk"
    body:
        type: textarea
        label: Supporting copy
        default: "Occasional writing on design, code, and running a one-person studio. No schedule, no filler."
    items:
        type: repeater
        label: Posts
        add_button_label: "Add post"
        item_label: title
        source: "journal"
        sub_fields:
            title:
                type: text
                label: Title
                default: "New post"
            date:
                type: text
                label: Date
                default: "Jan 1, 2026"
            category:
                type: text
                label: Category
                default: "Notes"
            link:
                type: url
                label: Link
                default: "/journal"

            description:
                type: textarea
                label: "Standfirst"
            content:
                type: richtext
                label: "Post body"
            image:
                type: image
                label: "Cover image"
            imageAlt:
                type: text
                label: "Image alt text"
            author:
                type: text
                label: "Author"
            authorRole:
                type: text
                label: "Author role"
            authorImage:
                type: image
                label: "Author photo"
            readTime:
                type: text
                label: "Read time"
            slug:
                type: text
                label: "Slug"